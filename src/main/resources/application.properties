spring.application.name=cache-aside-microservice

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cacheaside
spring.datasource.username=cacheaside
spring.datasource.password=cacheaside
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache
cache.product.ttl-minutes=10

# Springdoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
