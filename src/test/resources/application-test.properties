# H2 in-memory DB for unit tests — no real PostgreSQL needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Exclude Redis auto-configuration so no real Redis connection is attempted
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Cache TTL (default)
cache.product.ttl-minutes=10

# Allow CacheConfig and TestCacheConfig bean co-existence safety
spring.main.allow-bean-definition-overriding=true